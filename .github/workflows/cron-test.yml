name: Cron test

on:
  workflow_dispatch: {}
  schedule:
    # Deuxième round de test du cron natif, cette fois sur le repo Theodo
    # (plan potentiellement différent de mon compte perso, où on avait déjà
    # constaté un créneau retardé de ~1h40 et un autre jamais déclenché).
    # Créneaux étalés sur le week-end pour voir si un plan Theodo se comporte
    # différemment. Décalés à :15 (pas pile à l'heure, période la plus chargée
    # selon la doc GitHub). Heures ci-dessous en UTC ; CEST = UTC+2 en ce moment.
    - cron: "15 14 24 7 *"  # ven. 24/07 16:15 CEST
    - cron: "15 16 24 7 *"  # ven. 24/07 18:15 CEST
    - cron: "15 19 24 7 *"  # ven. 24/07 21:15 CEST
    - cron: "15 8 25 7 *"   # sam. 25/07 10:15 CEST
    - cron: "15 8 26 7 *"   # dim. 26/07 10:15 CEST
    - cron: "15 18 26 7 *"  # dim. 26/07 20:15 CEST

jobs:
  send-test-email:
    runs-on: ubuntu-latest
    steps:
      - name: Envoyer un mail de test
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python3 -c "
          import os, smtplib
          from email.mime.text import MIMEText
          from email.utils import formataddr
          from datetime import datetime, timezone

          trigger = os.environ.get('GITHUB_EVENT_NAME', 'inconnu')
          trigger_label = {
              'schedule': 'CRON NATIF GitHub Actions (schedule:)',
              'workflow_dispatch': 'cron-job.org (workflow_dispatch)',
          }.get(trigger, trigger)
          body = (
              f'Declencheur de ce run : {trigger_label}\n\n'
              'Ceci est un test de declenchement automatique, sans aucune action humaine.\n\n'
              f'Heure UTC au moment de l ecriture du mail : {datetime.now(timezone.utc).isoformat()}\n\n'
              'Si tu recois ce mail sans avoir rien clique, le mecanisme indique '
              'ci-dessus a bien fonctionne sur ce repo.\n\n'
              'Ce test verifie aussi le nom d expediteur : tu dois voir '
              \"'Regulatory Watch Tower' plutot que l adresse Gmail brute.\"
          )
          msg = MIMEText(body)
          msg['Subject'] = 'Test cron GitHub Actions — Compliance-timeline'
          msg['From'] = formataddr(('Regulatory Watch Tower', os.environ['GMAIL_ADDRESS']))
          msg['To'] = os.environ['GMAIL_ADDRESS']

          with smtplib.SMTP_SSL('smtp.gmail.com', 465) as s:
              s.login(os.environ['GMAIL_ADDRESS'], os.environ['GMAIL_APP_PASSWORD'])
              s.send_message(msg)
          print('Email de test envoye.')
          "
