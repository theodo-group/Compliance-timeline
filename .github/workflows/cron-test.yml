name: Cron test

on:
  # Le cron natif schedule: a été testé et abandonné (délais jusqu'à ~1h40,
  # et un créneau jamais déclenché du tout — voir Synthese-Migration).
  # Ce workflow n'est plus déclenché que par cron-job.org via workflow_dispatch.
  workflow_dispatch: {}

jobs:
  send-test-email:
    runs-on: ubuntu-latest
    steps:
      - name: Envoyer un mail de test
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python3 -c "
          import os, smtplib
          from email.mime.text import MIMEText
          from email.utils import formataddr
          from datetime import datetime, timezone

          body = (
              'Ceci est un test du declenchement automatique via cron-job.org '
              '(workflow_dispatch), sans aucune action humaine.\n\n'
              f'Heure UTC au moment de l ecriture du mail : {datetime.now(timezone.utc).isoformat()}\n\n'
              'Si tu recois ce mail sans avoir rien clique, le declenchement '
              'externe marche sur ce repo et on peut brancher le vrai job hebdomadaire en confiance.\n\n'
              'Ce test verifie aussi le nom d expediteur : tu dois voir '
              \"'Regulatory Watch Tower' plutot que l adresse Gmail brute.\"
          )
          msg = MIMEText(body)
          msg['Subject'] = 'Test cron GitHub Actions — Compliance-timeline'
          msg['From'] = formataddr(('Regulatory Watch Tower', os.environ['GMAIL_ADDRESS']))
          msg['To'] = os.environ['GMAIL_ADDRESS']

          with smtplib.SMTP_SSL('smtp.gmail.com', 465) as s:
              s.login(os.environ['GMAIL_ADDRESS'], os.environ['GMAIL_APP_PASSWORD'])
              s.send_message(msg)
          print('Email de test envoye.')
          "
