name: Deploy to GitHub Pages
on:
  push:
    branches: [main]

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Ne publier QUE les fichiers du site. Avec path '.', tout le repo était
      # servi publiquement : automation/recipients.json (adresses email) et
      # automation/state/ (contenu des emails internes, dumps LLM) compris.
      - name: Build publish folder (site files only)
        run: |
          mkdir -p _site
          cp index.html fr.html admin.html _site/
          cp data.json data-fr.json proposals.json proposals-fr.json decisions.json _site/
          cp *.png _site/ 2>/dev/null || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - id: deployment
        uses: actions/deploy-pages@v4
