name: Regulatory Watch (weekly)

on:
  # Déclenchement manuel pendant la phase de test (voir automation/recipients.json —
  # ne mettre que des destinataires de test tant que le cron ci-dessous est désactivé).
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Générer sans envoyer d'email ni pousser sur git (test)"
        type: boolean
        default: true
      skip_fixed_sources:
        description: "Sauter le fetch des ~12 sources fixes (test rapide, déjà validé séparément)"
        type: boolean
        default: false
      skip_content_call:
        description: "Sauter l'appel email+rapport, tester uniquement les propositions (test rapide)"
        type: boolean
        default: false
      replay_content:
        description: "Rejouer le dernier email+rapport committé (automation/state) au lieu d'appeler le modèle — 0 coût"
        type: boolean
        default: false
      replay_proposals:
        description: "Rejouer les dernières propositions committées (automation/state) au lieu d'appeler le modèle — 0 coût"
        type: boolean
        default: false
      standards_status_only:
        description: "Tester UNIQUEMENT le fetch Playwright CEN-CENELEC (equivalent CI de automation/tools/check_standards_status.py) — aucun Sonar, aucun LLM, aucun mail"
        type: boolean
        default: false

  # Planifié tous les vendredis matin. ATTENTION : le cron GitHub est en UTC et ne gère PAS
  # l'heure d'été. 04:00 UTC = 06:00 à Paris l'été (CEST) / 05:00 l'hiver (CET). GitHub peut
  # aussi décaler le déclenchement de quelques minutes (voire le sauter sous forte charge).
  # NE PAS activer en parallèle un déclencheur cron-job.org sur ce workflow : les deux
  # feraient tourner le job deux fois le vendredi (deux emails, deux lots de propositions).
  schedule:
    - cron: "0 4 * * 5"

permissions:
  contents: write

concurrency:
  group: regulatory-watch
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # ~25 petits appels LLM (triage + 1/item + propositions + 1/carte FR) +
    # 12 fetches + 8 Sonar : 15 min était trop juste dans le pire cas.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r automation/requirements.txt

      - name: Install Playwright browser (Chromium only)
        run: playwright install --with-deps chromium

      - name: Test isolé — fetch Playwright CEN-CENELEC uniquement
        if: ${{ github.event.inputs.standards_status_only == 'true' }}
        run: python automation/tools/check_standards_status.py

      - name: Run weekly regulatory watch
        if: ${{ github.event.inputs.standards_status_only != 'true' }}
        env:
          LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          SKIP_FIXED_SOURCES: ${{ github.event.inputs.skip_fixed_sources || 'false' }}
          SKIP_CONTENT_CALL: ${{ github.event.inputs.skip_content_call || 'false' }}
          REPLAY_CONTENT: ${{ github.event.inputs.replay_content || 'false' }}
          REPLAY_PROPOSALS: ${{ github.event.inputs.replay_proposals || 'false' }}
        run: python automation/weekly_watch.py

      - name: Upload generated artifacts (dry-run inspection)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regulatory-watch-output
          path: |
            proposals.json
            proposals-fr.json
            automation/state/last_email.html
            automation/state/last_full_report.html
            automation/state/debug_last_content_output.txt
            automation/state/debug_last_proposals_output.txt
            automation/state/debug_last_standards_status_output.txt
          if-no-files-found: ignore
